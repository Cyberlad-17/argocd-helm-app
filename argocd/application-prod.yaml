apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: demo-web-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/argocd-helm-app.git
    targetRevision: main
    path: .

    helm:
      releaseName: demo-web
      valueFiles:
        - values.yaml
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-web-prod

  syncPolicy:
    automated:
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
