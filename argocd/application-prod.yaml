apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: demo-web-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Cyberlad-17/argocd-helm-app.git
    targetRevision: main
    path: .

    helm:
      releaseName: demo-web
      valueFiles:
        - values.yaml
        - values-prod.yaml